<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Auto Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="https://duckduckgo.com/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Header Card -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-orange-500/10 border border-orange-500/20 mb-4 shadow-lg shadow-orange-500/5">
        <svg class="w-9 h-9 text-orange-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
          <path d="M2 12h20"></path>
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Auto Web Manager</h1>
      <p class="text-slate-400 text-sm mt-1">Sistem Pengarah Web & Gateway DuckDuckGo</p>
    </div>

    <!-- Login Box -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-sm">
      <div id="alertBox" class="hidden mb-4 p-3.5 rounded-xl text-sm font-medium"></div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            required 
            placeholder="admin"
            class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            placeholder="••••••••"
            class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all"
          >
        </div>

        <button 
          type="submit" 
          id="btnSubmit"
          class="w-full mt-2 py-3 px-4 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-semibold rounded-xl shadow-lg shadow-orange-500/20 transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer"
        >
          <span>Masuk ke Panel</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
          </svg>
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-slate-800/80 text-center">
        <p class="text-xs text-slate-500">
          Default akun: <span class="text-slate-400 font-mono">admin</span> / <span class="text-slate-400 font-mono">admin123</span>
        </p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const btnSubmit = document.getElementById('btnSubmit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = 'Memproses...';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          alertBox.className = 'mb-4 p-3.5 rounded-xl text-sm font-medium bg-emerald-500/10 border border-emerald-500/20 text-emerald-400';
          alertBox.textContent = 'Login berhasil! Mengalihkan...';
          alertBox.classList.remove('hidden');
          setTimeout(() => {
            window.location.href = '/admin';
          }, 600);
        } else {
          alertBox.className = 'mb-4 p-3.5 rounded-xl text-sm font-medium bg-rose-500/10 border border-rose-500/20 text-rose-400';
          alertBox.textContent = data.error || 'Username atau password salah.';
          alertBox.classList.remove('hidden');
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<span>Masuk ke Panel</span>';
        }
      } catch (err) {
        alertBox.className = 'mb-4 p-3.5 rounded-xl text-sm font-medium bg-rose-500/10 border border-rose-500/20 text-rose-400';
        alertBox.textContent = 'Terjadi kesalahan koneksi server.';
        alertBox.classList.remove('hidden');
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>Masuk ke Panel</span>';
      }
    });
  </script>
</body>
</html>
