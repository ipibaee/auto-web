<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>{{metaTitle}}</title>
  <meta name="description" content="{{metaDescription}}">
  <link rel="icon" href="{{metaFavicon}}">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.98); }
    }
    .animate-pulse-fast { animation: pulse-fast 1.4s ease-in-out infinite; }
  </style>
</head>
<body class="bg-[#1c1d22] text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-lg text-center space-y-6">
    <!-- DuckDuckGo Logo Header -->
    <div class="flex items-center justify-center gap-3">
      <img src="https://duckduckgo.com/assets/logo_homepage.normal.v109.svg" alt="DuckDuckGo" class="h-16 w-auto mx-auto" onerror="this.onerror=null; this.src='https://duckduckgo.com/favicon.ico'">
    </div>

    <!-- Search Box Simulator -->
    <div class="relative bg-[#28292e] border border-slate-700/80 rounded-full px-5 py-3.5 shadow-xl flex items-center gap-3 text-left">
      <svg class="w-5 h-5 text-orange-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
      <div class="w-full text-slate-300 text-sm truncate font-mono select-none" id="statusMessage">
        Memverifikasi jalur pencarian aman...
      </div>
      <div class="w-4 h-4 border-2 border-orange-500 border-t-transparent rounded-full animate-spin shrink-0"></div>
    </div>

    <!-- Loading Bar -->
    <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
      <div id="progressBar" class="bg-gradient-to-r from-orange-500 to-amber-400 h-1.5 rounded-full transition-all duration-300 ease-out" style="width: 15%"></div>
    </div>

    <p class="text-xs text-slate-400">
      Mengalihkan secara aman melalui protokol privasi DuckDuckGo. Silakan tunggu beberapa detik...
    </p>

    <div class="pt-2">
      <a id="manualJumpBtn" href="#" class="text-xs text-slate-500 hover:text-orange-400 underline transition">
        Jika tidak beralih otomatis dalam 5 detik, klik di sini
      </a>
    </div>
  </div>

  <script>
    const targetUrl = {{targetUrlJson}};
    const delaySeconds = {{delaySeconds}};
    
    document.getElementById('manualJumpBtn').href = targetUrl;

    const progressBar = document.getElementById('progressBar');
    const statusMessage = document.getElementById('statusMessage');

    let progress = 20;
    const interval = setInterval(() => {
      progress += 25;
      if (progress >= 95) {
        clearInterval(interval);
        progress = 100;
        statusMessage.textContent = 'Menghubungkan ke tujuan...';
      }
      progressBar.style.width = progress + '%';
    }, Math.max(300, (delaySeconds * 1000) / 4));

    setTimeout(() => {
      window.location.replace(targetUrl);
    }, Math.max(800, delaySeconds * 1000));
  </script>
</body>
</html>
