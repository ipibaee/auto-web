<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{metaTitle}}</title>
  <meta name="description" content="{{metaDescription}}">
  <link rel="icon" href="{{metaFavicon}}">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#1c1d22] text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6">
  <!-- Top Bar -->
  <header class="flex justify-between items-center max-w-6xl w-full mx-auto">
    <div class="flex items-center gap-2 text-xs font-semibold text-slate-400">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>
      <span>Pencarian Privat Aktif</span>
    </div>
    <div class="flex items-center gap-4 text-xs text-slate-400">
      <a href="https://duckduckgo.com/about" target="_blank" class="hover:text-white transition">Tentang</a>
      <a href="https://duckduckgo.com/privacy" target="_blank" class="hover:text-white transition">Privasi</a>
    </div>
  </header>

  <!-- Center Search Area -->
  <main class="w-full max-w-2xl mx-auto text-center space-y-6 my-auto">
    <!-- DuckDuckGo Logo -->
    <div class="flex flex-col items-center justify-center gap-3">
      <img 
        src="https://duckduckgo.com/assets/logo_homepage.normal.v109.svg" 
        alt="DuckDuckGo" 
        class="h-24 sm:h-28 w-auto"
        onerror="this.onerror=null; this.src='https://duckduckgo.com/favicon.ico'"
      >
      <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">DuckDuckGo Search</h1>
      <p class="text-xs text-slate-400">Pencarian cepat tanpa pelacakan riwayat dan data pribadi.</p>
    </div>

    <!-- Real DuckDuckGo Search Form -->
    <form action="https://duckduckgo.com/" method="GET" class="w-full">
      <div class="relative flex items-center">
        <input 
          type="text" 
          name="q" 
          autocomplete="off" 
          placeholder="Cari di web tanpa dilacak..."
          required
          class="w-full py-4 pl-12 pr-28 bg-[#28292e] border border-slate-700/80 rounded-full text-white placeholder-slate-400 text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent shadow-2xl transition"
        >
        <div class="absolute left-4 text-slate-400 pointer-events-none">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
        <button 
          type="submit" 
          class="absolute right-2 px-5 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-semibold text-xs sm:text-sm rounded-full transition shadow-md"
        >
          Cari
        </button>
      </div>

      <div class="mt-4 flex items-center justify-center gap-2 flex-wrap">
        <button 
          type="submit" 
          name="ia" 
          value="web"
          class="px-4 py-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs rounded-xl border border-slate-700/60 transition"
        >
          DuckDuckGo Search
        </button>
        <button 
          type="submit" 
          name="k1" 
          value="-1"
          class="px-4 py-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs rounded-xl border border-slate-700/60 transition"
        >
          Mode Penyamaran Bebas Iklan
        </button>
      </div>
    </form>
  </main>

  <!-- Footer -->
  <footer class="max-w-6xl w-full mx-auto text-center text-[11px] text-slate-600 py-4">
    Proteksi Privasi &bull; Mesin Pencari Bebas Pelacakan &bull; Powered by DuckDuckGo
  </footer>
</body>
</html>
